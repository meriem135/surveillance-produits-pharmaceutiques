rules:
  # ── DPI-001 : Variation brusque (Δt) — seuils corrigés par capteur ──
  # Problème original : 5°C sur échantillons espacés 3h → 37-48% faux positifs
  # Fix : weather/thermostat 13°C, fridge 5°C
  - id: "DPI-001"
    name: "Variation brusque (Δt)"
    description: "Variation brutale > seuil (weather 13°C, fridge 5°C, thermostat 13°C)"
    enabled: true
    severity: 9
    group: "behavioral"
    conditions:
      field: "__delta__"
      operator: "gt"
      value: 5.0
      sensor_config:
        multi-sensor:
          fields: ["weather_temperature", "fridge_temperature", "thermostat_temperature"]
          delta_threshold: 5.0
          thresholds:
            weather_temperature: 14.0
            fridge_temperature: 5.0
            thermostat_temperature: 16.0
        weather:
          fields: ["temperature"]
          delta_threshold: 14.0
        fridge:
          fields: ["fridge_temperature"]
          delta_threshold: 5.0
        thermostat:
          fields: ["current_temperature"]
          delta_threshold: 16.0
    correlation:
      boost_on_match: 3

  # ── DPI-004 : Anomalie saisonnière (3σ adaptatif) ──
  # Problème original : stats fixes → fausses alertes en hiver, aveugle en été
  # Fix : moyenne et écart-type par saison calculés sur le dataset réel
  - id: "DPI-004"
    name: "Anomalie saisonnière (3σ adaptatif)"
    description: "Valeur > 3σ de la moyenne saisonnière — dérive anormale pour la saison"
    enabled: true
    severity: 10
    group: "sensor"
    conditions:
      field: null
      operator: "zscore"
      sensor_stats:
        multi-sensor_Hiver:
          weather_temperature:    {mean: 5.7,  std: 4.9}
          fridge_temperature:     {mean: 3.8,  std: 1.5}
          thermostat_temperature: {mean: 3.7,  std: 4.6}
        multi-sensor_Printemps:
          weather_temperature:    {mean: 17.9, std: 4.1}
          fridge_temperature:     {mean: 4.2,  std: 1.6}
          thermostat_temperature: {mean: 16.6, std: 5.1}
        multi-sensor_Été:
          weather_temperature:    {mean: 31.0, std: 4.3}
          fridge_temperature:     {mean: 3.5,  std: 1.4}
          thermostat_temperature: {mean: 29.2, std: 4.4}
        multi-sensor_Automne:
          weather_temperature:    {mean: 19.0, std: 4.2}
          fridge_temperature:     {mean: 3.6,  std: 1.6}
          thermostat_temperature: {mean: 17.3, std: 4.7}
    correlation:
      boost_on_match: 3

  # ── DPI-005 : Spike température (ex-Seuil > 1000) ──
  # Problème original : seuil 1000 → jamais déclenché
  # Fix : seuil 42°C (attaque injecte max +8°C → 46.9°C max)
  - id: "DPI-005"
    name: "Spike température (> 42°C)"
    description: "Température > 42°C sur capteur ambiant — valeur anormalement élevée"
    enabled: true
    severity: 5
    group: "sensor"
    conditions:
      field: "__any_numeric__"
      operator: "gt"
      value: 42.0
      exclude_fields: ["timestamp", "device_type", "label", "normality_score", "month", "season", "attack_active", "dpi_alert", "dpi_stats"]
    correlation:
      boost_on_match: 2
