# VigiloChain avec Docker : PostgreSQL + l'application (API et dashboard sur un seul port).
#
#   cp backend/.env.example backend/.env   # JWT_SECRET_KEY, ADMIN_PASSWORD, CORS_ORIGINS…
#   echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" > .env
#   docker compose up -d --build
#   → http://localhost:8000/dashboard   (VIGILO_PORT=8010 dans .env pour changer de port)
#
# Tests : docker compose exec app python -m pytest tests -q
# Le port n'écoute que sur 127.0.0.1 : publier l'application derrière un proxy (Caddy, nginx).
name: vigilochain

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vigilochain
      POSTGRES_USER: vigilochain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vigilochain}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigilochain -d vigilochain"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Interface web pour consulter la base : http://localhost:8080
  # (Système : PostgreSQL, Serveur : db, Utilisateur/Base : vigilochain)
  adminer:
    image: adminer
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "127.0.0.1:8080:8080"

  app:
    build: .
    image: vigilochain:latest
    restart: unless-stopped
    env_file:
      - path: backend/.env
        required: false
    environment:
      # La base du conteneur db
      DATABASE_URL: postgresql+asyncpg://vigilochain:${POSTGRES_PASSWORD:-vigilochain}@db:5432/vigilochain
      API_BASE_URL: http://127.0.0.1:8000/api/v1
      # Heures affichées (rapport, « dernier entraînement ») à l'heure de la Tunisie ; la base reste en UTC
      TZ: Africa/Tunis
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${VIGILO_PORT:-8000}:8000"
    volumes:
      - data:/app/data
      - models:/app/models

volumes:
  pgdata:
  data:
  models:
